<ion-app>

  <!-- MENÚ LATERAL GLOBAL ALUMNO / GENERAL (Sin persistent="true") -->
  <ion-menu 
    contentId="main-content" 
    side="start" 
    type="overlay" 
    (ionWillOpen)="validarAperturaMenu()">
    
    <!-- ENCABEZADO DEL MENÚ -->
    <ion-header class="ion-no-border">
      <ion-toolbar class="menu-toolbar">
        <div class="brand-container">
          <img src="assets/logo.png" alt="Logo Aquí Todos Ganan" class="brand-logo" />
        </div>
      </ion-toolbar>
    </ion-header>

    <!-- CUERPO DEL MENÚ -->
    <ion-content class="menu-content">
      <div class="menu-body">
        
        <!-- MOSTRAR SECCIONES SOLO SI EL USUARIO ESTÁ LOGUEADO -->
        <ng-container *ngIf="estaLogueado()">

          <!-- SECCIÓN 1: GENERAL -->
          <p class="menu-section-title">General</p>

          <ion-list lines="none" class="menu-list">
            
            <!-- Inicio -->
            <ion-item 
              button
              (click)="cerrarMenu()" 
              routerLink="/home" 
              routerLinkActive="menu-item-activo" 
              [routerLinkActiveOptions]="{ exact: true }"
              class="menu-item-custom">
              <ion-icon name="home-outline" slot="start" class="menu-icon"></ion-icon>
              <ion-label class="menu-label notranslate" translate="no">Inicio</ion-label>
            </ion-item>

            <!-- Perfil -->
            <ion-item 
              button
              (click)="cerrarMenu()" 
              routerLink="/perfil" 
              routerLinkActive="menu-item-activo"
              class="menu-item-custom">
              <ion-icon name="person-outline" slot="start" class="menu-icon"></ion-icon>
              <ion-label class="menu-label notranslate" translate="no">Mi Perfil</ion-label>
            </ion-item>

          </ion-list>

          <!-- SECCIÓN 2: ACTIVIDADES -->
          <p class="menu-section-title">Actividades</p>

          <ion-list lines="none" class="menu-list">

            <!-- Inscribir Actividad (Solo Alumno 1 y Consejero de Carrera 4) -->
            <ion-item 
              *ngIf="esAlumnoOConsejero()"
              button
              (click)="cerrarMenu()" 
              routerLink="/inscribir-actividad" 
              routerLinkActive="menu-item-activo"
              class="menu-item-custom">
              <ion-icon name="add-circle-outline" slot="start" class="menu-icon"></ion-icon>
              <ion-label class="menu-label notranslate" translate="no">Inscribir Actividad</ion-label>
            </ion-item>

            <!-- Mis Actividades (Solo Alumno 1 y Consejero de Carrera 4) -->
            <ion-item 
              *ngIf="esAlumnoOConsejero()"
              button
              (click)="cerrarMenu()" 
              routerLink="/mis-actividades" 
              routerLinkActive="menu-item-activo"
              class="menu-item-custom">
              <ion-icon name="calendar-outline" slot="start" class="menu-icon"></ion-icon>
              <ion-label class="menu-label notranslate" translate="no">Mis Actividades</ion-label>
            </ion-item>

            <!-- Administrar Actividades (Solo Docente 3 y Consejero de Carrera 4) -->
            <ion-item 
              *ngIf="esAdminActividades()"
              button
              (click)="cerrarMenu()" 
              routerLink="/admin-actividades" 
              routerLinkActive="menu-item-activo"
              class="menu-item-custom">
              <ion-icon name="options-outline" slot="start" class="menu-icon"></ion-icon>
              <ion-label class="menu-label notranslate" translate="no">Administrar Actividades</ion-label>
            </ion-item>

          </ion-list>

          <!-- SECCIÓN 3: PUNTOS Y PREMIOS -->
          <p class="menu-section-title">Puntos y Premios</p>

          <ion-list lines="none" class="menu-list">

            <!-- Canjear Puntos (Solo Alumno 1 y Consejero de Carrera 4) -->
            <ion-item 
              *ngIf="esAlumnoOConsejero()"
              button
              (click)="cerrarMenu()" 
              routerLink="/canjear" 
              routerLinkActive="menu-item-activo"
              class="menu-item-custom">
              <ion-icon name="gift-outline" slot="start" class="menu-icon"></ion-icon>
              <ion-label class="menu-label notranslate" translate="no">Canjear Puntos</ion-label>
            </ion-item>

            <!-- Mis Premios (Solo Alumno 1 y Consejero de Carrera 4) -->
            <ion-item 
              *ngIf="esAlumnoOConsejero()"
              button
              (click)="cerrarMenu()" 
              routerLink="/mis-premios" 
              routerLinkActive="menu-item-activo"
              class="menu-item-custom">
              <ion-icon name="trophy-outline" slot="start" class="menu-icon"></ion-icon>
              <ion-label class="menu-label notranslate" translate="no">Mis Premios</ion-label>
            </ion-item>

            <!-- Administrar Canjes (Solo Docente 3 y Consejero de Carrera 4) -->
            <ion-item 
              *ngIf="esAdminActividades()"
              button
              (click)="cerrarMenu()" 
              routerLink="/admin-canjes" 
              routerLinkActive="menu-item-activo"
              class="menu-item-custom">
              <ion-icon name="ticket-outline" slot="start" class="menu-icon"></ion-icon>
              <ion-label class="menu-label notranslate" translate="no">Administrar Canjes</ion-label>
            </ion-item>

          </ion-list>

        </ng-container>

        <!-- MENSAJE SI NO HA INICIADO SESIÓN -->
        <div *ngIf="!estaLogueado()" class="ion-padding ion-text-center">
          <p style="color: #666; margin-bottom: 16px;">Debes iniciar sesión para acceder al menú.</p>
          <ion-button routerLink="/login" (click)="cerrarMenu()" expand="block" shape="round">
            Iniciar Sesión
          </ion-button>
        </div>

      </div>
    </ion-content>

    <!-- PIE DEL MENÚ -->
    <ion-footer class="ion-no-border menu-footer">
      <div class="footer-content">
        <span class="notranslate" translate="no">Aquí Todos Ganan</span>
        <span class="badge-version">v1.0.0</span>
      </div>
    </ion-footer>

  </ion-menu>

  <!-- RUTAS DE NAVEGACIÓN -->
  <ion-router-outlet id="main-content"></ion-router-outlet>

</ion-app>
