<app-header></app-header>

<ion-content class="login-content ion-no-padding">
  <div class="login-container">
    <div class="login-card">

      <!-- Logo de la Plataforma -->
      <div class="logo-box">
        <img src="assets/logo.png" alt="Logo Institucional" class="login-logo" />
      </div>

      <!-- Encabezado de la Tarjeta -->
      <div class="login-header">
        <h1>Bienvenid@</h1>
        <p>Accede con tu cuenta</p>
      </div>

      <!-- Mensaje Visual de Bloqueo Temporal -->
      <div *ngIf="bloqueadoTemporalmente" class="bloqueo-banner ion-margin-bottom">
        <ion-text color="danger">
          <p class="ion-text-center">
            <strong>Cuenta bloqueada por seguridad.</strong><br>
            Reintenta en <strong>{{ segundosRestantes }}s</strong>
          </p>
        </ion-text>
      </div>

      <!-- Formulario de Entrada -->
      <div class="form-container">
        <ion-item class="input-item" lines="none">
          <ion-icon name="person-outline" slot="start"></ion-icon>
          <ion-input 
            type="email" 
            placeholder="usuario@gmail.com" 
            label="Correo" 
            labelPlacement="floating" 
            [disabled]="bloqueadoTemporalmente"
            [(ngModel)]="credenciales.correo">
          </ion-input>
        </ion-item>

        <!-- Campo de Contraseña con Ojito -->
        <ion-item class="input-item" lines="none">
          <ion-icon name="lock-closed-outline" slot="start"></ion-icon>
          <ion-input 
            [type]="mostrarPassword ? 'text' : 'password'" 
            placeholder="••••••••" 
            label="Contraseña" 
            labelPlacement="floating" 
            [disabled]="bloqueadoTemporalmente"
            [(ngModel)]="credenciales.password">
          </ion-input>
          <ion-icon 
            [name]="mostrarPassword ? 'eye-off-outline' : 'eye-outline'" 
            slot="end" 
            class="icon-ojo"
            (click)="toggleMostrarPassword()">
          </ion-icon>
        </ion-item>

        <ion-button 
          expand="block" 
          color="warning" 
          class="btn-login-main" 
          [disabled]="bloqueadoTemporalmente"
          (click)="iniciarSesion()">
          {{ bloqueadoTemporalmente ? 'Bloqueado (' + segundosRestantes + 's)' : 'Ingresar' }}
        </ion-button>

        <div class="login-footer-links">
          <ion-button fill="clear" routerLink="/recuperar" class="btn-forgot" [disabled]="bloqueadoTemporalmente">
            ¿Olvidaste tu contraseña?
          </ion-button>
        </div>
      </div>

    </div>
  </div>
  <app-footer></app-footer>
</ion-content>
